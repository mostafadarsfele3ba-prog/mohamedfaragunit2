<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>درس ثمرة القراءة - الصف الثالث الإعدادي</title>
    <!-- استدعاء خط احترافي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #14532d;      
            --primary-light: #16a34a; 
            --secondary: #059669;    
            --success: #10b981;      
            --danger: #ef4444;       
            --warning: #65a30d;      
            --dark: #1e293b;         
            --light: #f8fafc;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #eef6f0;
            background-image: radial-gradient(#c9dccd 1.5px, transparent 1.5px);
            background-size: 25px 25px;
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .hidden { display: none !important; }
        
        /* --- الهيدر الرئيسي --- */
        .header-main {
            background: linear-gradient(135deg, #052e16, var(--primary), var(--secondary));
            color: white;
            padding: 30px 20px 90px 20px; 
            text-align: center;
            position: relative;
            margin-bottom: 20px;
        }

        .header-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-line1 {
            font-size: clamp(1.1rem, 4vw, 1.5rem); 
            font-weight: 700;
            color: #dcfce7;
            margin-bottom: 5px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.3);
        }

        .title-line2 {
            font-size: clamp(1.4rem, 5.5vw, 2.6rem); 
            font-weight: 900;
            background: linear-gradient(to right, #4ade80, #15803d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5));
            line-height: 1.3;
            text-align: center;
        }

        .header-main h2 { font-size: clamp(1rem, 3vw, 1.3rem); font-weight: 600; color: #ecfdf5; margin-bottom: 8px; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);}
        .header-main p { font-size: clamp(0.9rem, 2.5vw, 1.1rem); font-weight: 600; background: rgba(0,0,0,0.3); display: inline-block; padding: 6px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 4px 6px rgba(0,0,0,0.1);}

        .header-wave {
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: auto;
            z-index: 1;
        }

        /* --- الأزرار --- */
        .btn {
            background: linear-gradient(to bottom, var(--primary-light), var(--primary));
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-bottom: 3px solid rgba(0,0,0,0.3);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.2); }
        .btn:active { transform: translateY(2px); border-bottom: 0px; margin-top: 3px; }
        .btn-correct { filter: brightness(1.2); pointer-events: none; border-bottom-width: 0; transform: translateY(2px);}
        .btn-wrong { filter: brightness(0.8); pointer-events: none; border-bottom-width: 0; transform: translateY(2px);}

        /* --- الشاشة الرئيسية --- */
        #home-screen {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1000px;
            padding-bottom: 80px;
        }

        .menu-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.025);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .menu-card::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            opacity: 0; transition: opacity 0.3s;
        }
        .menu-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); border-color: rgba(34, 197, 94, 0.25); }
        .menu-card:hover::before { opacity: 1; }
        
        .menu-card .icon-container {
            width: 80px; height: 80px;
            margin: 0 auto 15px auto;
            background: linear-gradient(135deg, #dcfce7, #bbf7d0);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 3px 6px rgba(255,255,255,0.8), 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .menu-card .icon-container svg {
            width: 40px; height: 40px; stroke: #14532d; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .menu-card:hover .icon-container { transform: scale(1.1) rotate(10deg); }
        .menu-card h3 { font-size: 1.4rem; color: var(--dark); font-weight: 800; margin-bottom: 8px;}
        .menu-card p { font-size: 1rem; color: #64748b; font-weight: 600;}

        /* --- شاشة اللعب --- */
        #game-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .game-nav {
            background: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: clamp(0.9rem, 3vw, 1.2rem);
        }
        .back-btn { background: #e2e8f0; color: var(--dark); border-bottom: 3px solid #cbd5e1; padding: 8px 15px;}
        #game-progress { background: #16a34a; color: white; padding: 6px 15px; border-radius: 20px;}
        
        .game-container {
            flex: 1;
            padding: 0 20px 40px 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .question-box {
            background: white;
            padding: 20px 25px;
            border-radius: 16px;
            text-align: center;
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            font-weight: 800;
            color: #14532d;
            margin-bottom: 25px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            border-right: 8px solid #059669;
            line-height: 1.6;
        }

        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* MCQ Style */
        .options-grid { display: flex; flex-direction: column; gap: 15px; }
        .options-grid .btn { padding: 18px; font-size: clamp(1.1rem, 3.5vw, 1.4rem); text-align: right; justify-content: flex-start; border-radius: 12px;}

        /* True/False Style */
        .tf-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }

        /* Bubbles Style */
        .bubbles-area {
            position: relative; height: 400px;
            background: linear-gradient(to bottom, #052e16, #14532d);
            border-radius: 16px; overflow: hidden;
            border: 4px solid #16a34a; margin-top: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .bubble {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(224,231,255,0.9));
            color: #14532d;
            border: 2px solid #ffffff;
            padding: 10px 5px;
            border-radius: 30px;
            font-weight: 800; font-size: clamp(0.85rem, 2vw, 1.05rem);
            box-shadow: 0 10px 15px rgba(0,0,0,0.2), inset -4px -4px 10px rgba(0,0,0,0.1);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            text-align: center;
            width: 22%;
            transition: transform 0.2s, background 0.2s;
            z-index: 5;
        }
        .bubble:hover { transform: scale(1.05); }
        .bubble::after {
            content: ''; position: absolute; top: 10%; left: 15%;
            width: 20%; height: 20%; background: rgba(255,255,255,0.8);
            border-radius: 50%; filter: blur(2px);
        }

        /* Shooting Style */
        .shooting-area {
            position: relative; height: 400px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect fill="%23e0fbfc" width="100%" height="100%"/><circle fill="%23bae6fd" cx="20%" cy="30%" r="50"/><circle fill="%23bae6fd" cx="80%" cy="60%" r="70"/><circle fill="%23bae6fd" cx="50%" cy="80%" r="40"/></svg>') no-repeat center center;
            background-size: cover; border-radius: 16px; overflow: hidden;
            border: 4px solid #16a34a; margin-top: 10px; box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }
        .target-bird {
            position: absolute; background: white; color: var(--dark);
            padding: 10px 20px; border-radius: 30px; font-weight: 800; font-size: clamp(0.95rem, 3vw, 1.15rem);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15); cursor: crosshair;
            border: 3px solid var(--warning); white-space: nowrap; transition: background 0.2s;
            display: flex; align-items: center; gap: 8px;
        }
        .target-bird:hover { transform: scale(1.05); background: #f0fdf4; }

        /* Genius Challenge Style */
        .genius-wrap {
            background: linear-gradient(135deg, #052e16, #14532d, #15803d);
            border-radius: 16px; padding: 20px; margin-top: 10px;
            border: 4px solid #4ade80; box-shadow: inset 0 0 25px rgba(0,0,0,0.4), 0 10px 20px rgba(21,128,61,0.35);
        }
        .genius-timer-track {
            width: 100%; height: 14px; background: rgba(0,0,0,0.35);
            border-radius: 10px; overflow: hidden; margin-bottom: 18px;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .genius-timer-bar {
            height: 100%; width: 100%;
            background: linear-gradient(to right, #4ade80, #16a34a, #ef4444);
            border-radius: 10px;
            transition: width 0.1s linear;
        }
        .genius-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { .genius-options { grid-template-columns: 1fr; } }
        .genius-options .btn {
            padding: 16px 10px; font-size: clamp(1rem, 3vw, 1.25rem);
            background: linear-gradient(to bottom, #22c55e, #15803d);
            border-bottom: 3px solid #14532d; border-radius: 14px; min-height: 70px;
        }
        .genius-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(74, 222, 128, 0.15); color: #4ade80;
            font-weight: 800; padding: 6px 16px; border-radius: 20px;
            border: 1px solid rgba(253,224,71,0.4); margin-bottom: 12px; font-size: 0.95rem;
        }

        /* Result Share (WhatsApp) */
        .share-box {
            margin-top: 25px; background: #f0fdf4; border: 2px solid #bbf7d0;
            border-radius: 16px; padding: 20px; text-align: center;
        }
        .share-box h4 { color: #166534; font-size: 1.2rem; margin-bottom: 12px; font-weight: 800;}
        .share-name-input {
            width: 100%; max-width: 320px; padding: 12px 16px; border-radius: 12px;
            border: 2px solid #86efac; font-size: 1.05rem; text-align: center;
            font-family: 'Cairo', sans-serif; font-weight: 700; margin-bottom: 12px;
            color: var(--dark);
        }
        .share-name-input:focus { outline: none; border-color: #16a34a; }
        .btn-share {
            background: linear-gradient(to bottom, #25d366, #1da851);
            border-bottom-color: #128c3e; display: inline-flex; gap: 10px;
        }
        .share-warning { color: var(--danger); font-weight: 700; font-size: 0.9rem; margin-top: 8px; display: none; }

        /* Modal Overlay */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .overlay.active { opacity: 1; pointer-events: all; }
        .modal {
            background: white; padding: 40px; border-radius: 25px;
            text-align: center; max-width: 90%; width: 400px;
            transform: scale(0.7) translateY(50px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .overlay.active .modal { transform: scale(1) translateY(0); }
        .modal-icon { display: flex; justify-content: center; margin-bottom: 20px; }

        /* Summary Errors Scrolling */
        .errors-list::-webkit-scrollbar { width: 8px; }
        .errors-list::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .errors-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .errors-list::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* الفوتر (Footer) */
        .footer-main {
            background: var(--dark); color: #cbd5e1;
            text-align: center; padding: 25px 20px; margin-top: auto;
            border-top: 4px solid var(--primary);
        }
        .footer-main p { margin: 5px 0; font-size: 1.1rem; font-weight: 600;}
        .footer-main .designer { font-size: 1rem; color: #94a3b8; font-weight: 400;}

        /* WhatsApp */
        .whatsapp-float {
            position: fixed; bottom: 25px; left: 25px;
            background: #25d366; color: white;
            width: 65px; height: 65px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            text-decoration: none; box-shadow: 0 8px 15px rgba(37, 211, 102, 0.4);
            z-index: 100; transition: all 0.3s;
        }
        .whatsapp-float:hover { transform: scale(1.15) rotate(-5deg); box-shadow: 0 12px 20px rgba(37, 211, 102, 0.6); }
        .whatsapp-float svg { width: 35px; height: 35px; fill: currentColor; }

        /* Confetti effect */
        .confetti {
            position: fixed; top: -10px; width: 12px; height: 12px; z-index: 9999;
            animation: fall linear forwards; border-radius: 3px;
        }
        @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
    </style>
</head>

    // --- محرك الصوت للمؤثرات التفاعلية ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playTone(freq, type, duration, vol = 0.1) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function playCorrect() {
        initAudio();
        playTone(523.25, 'sine', 0.1, 0.1); 
        setTimeout(() => playTone(659.25, 'sine', 0.1, 0.1), 100); 
        setTimeout(() => playTone(783.99, 'sine', 0.2, 0.15), 200); 
        setTimeout(() => playTone(1046.50, 'sine', 0.4, 0.2), 300); 
        triggerConfetti();
    }

    function playWrong() {
        initAudio();
        playTone(300, 'sawtooth', 0.15, 0.1);
        setTimeout(() => playTone(200, 'sawtooth', 0.25, 0.15), 150);
        
        const qBox = document.querySelector('.question-box');
        if(qBox) {
            qBox.classList.remove('shake');
            void qBox.offsetWidth; 
            qBox.classList.add('shake');
        }
    }

    function triggerConfetti() {
        const colors = ['#f72585', '#4cc9f0', '#fee440', '#00f5d4', '#8b5cf6'];
        for(let i=0; i<40; i++) {
            let conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = Math.random() * 100 + 'vw';
            conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            conf.style.animationDuration = (Math.random() * 2 + 1) + 's';
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), 3000);
        }
    }

    function shuffleArray(arr) {
        return arr.map(a => ({sort: Math.random(), value: a}))
            .sort((a, b) => a.sort - b.sort)
            .map(a => a.value);
    }

    function sendResultToTeacher(score, total) {

            `⭐ نسبة النجاح: ${Math.round((score/total)*100)}%`;
        if (typeof __sendToSheet === "function" && __sendToSheet(message)) return;
        const url = `https://wa.me/201143270328?text=${encodeURIComponent(typeof __sealResult === "function" ? __sealResult(message) : message)}`;

    function startGame(gameData) {
        initAudio();
        currentGame = gameData;
        currentQuestions = shuffleArray([...gameData.questions]);
        qIndex = 0;
        wrongAnswers = []; // تصفير قائمة الأخطاء
        
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('main-header').classList.add('hidden');
        document.getElementById('main-footer').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('game-title').innerText = gameData.title;
        
        renderNextState();
    }

    function renderNextState() {
        if (qIndex >= currentQuestions.length) {
            gameComplete();
            return;
        }

        const gc = document.getElementById('game-container');
        gc.innerHTML = '';
        updateProgress();

        if (currentGame.type === 'mcq') {
            renderMCQ(gc);
        } else if (currentGame.type === 'bubbles') {
            renderBubbles(gc);
        } else if (currentGame.type === 'shooting') {
            renderShooting(gc);
        } else if (currentGame.type === 'true_false') {
            renderTrueFalse(gc);
        } else if (currentGame.type === 'genius') {
            renderGenius(gc);
        }
    }

        const shuffledOptions = shuffleArray([...qData.options]);

        btnContainer.className = 'options-grid';
        
        let isAnswered = false;

        shuffledOptions.forEach(opt => {

            btn.innerText = opt;
            btn.onclick = () => {
                if(isAnswered) return;
                isAnswered = true;

                if (opt === correctText) {
                    btn.classList.add('btn-correct');
                    showFeedback(true, () => { qIndex++; renderNextState(); });
                } else {
                    btn.classList.add('btn-wrong');
                    wrongAnswers.push({ question: qData.q, correct: correctText, selected: opt });
                    showFeedback(false, () => { qIndex++; renderNextState(); });
                }
            };
            btnContainer.appendChild(btn);
        });

        const qBox = document.createElement('div');
        qBox.className = 'question-box';
        qBox.innerText = qData.q;
        
        container.appendChild(qBox);
        container.appendChild(btnContainer);

        const optContainer = document.createElement('div');
        optContainer.className = 'genius-options';

        let isAnswered = false;
        const TOTAL_TIME = 12000; // 12 ثانية لكل سؤال
        let startTime = Date.now();

        function finishQuestion(isCorrect, selectedText) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(geniusTimerInterval);
            if (!isCorrect) {
                wrongAnswers.push({ question: qData.q, correct: correctText, selected: selectedText || "انتهى الوقت!" });
            }
            showFeedback(isCorrect, () => { qIndex++; renderNextState(); });
        }

        shuffledOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt;
            btn.onclick = () => {
                if (isAnswered) return;
                if (opt === correctText) {
                    btn.classList.add('btn-correct');
                    finishQuestion(true, opt);
                } else {
                    btn.classList.add('btn-wrong');
                    finishQuestion(false, opt);
                }
            };
            optContainer.appendChild(btn);
        });

        wrap.appendChild(badge);
        wrap.appendChild(timerTrack);
        container.appendChild(wrap);
        container.appendChild(qBox);
        container.appendChild(optContainer);

        geniusTimerInterval = setInterval(() => {
            if (isAnswered) { clearInterval(geniusTimerInterval); return; }
            const elapsed = Date.now() - startTime;
            const pct = Math.max(0, 100 - (elapsed / TOTAL_TIME) * 100);
            timerBar.style.width = pct + '%';
            if (elapsed >= TOTAL_TIME) {
                clearInterval(geniusTimerInterval);
                finishQuestion(false, null);
            }
        }, 80);
    }

    function renderBubbles(container) {
        clearInterval(animInterval); clearInterval(geniusTimerInterval);
        const qData = currentQuestions[qIndex];
        const correctText = qData.options[qData.ans];
        const shuffledOptions = shuffleArray([...qData.options]);

        qBox.innerText = qData.q;
        
        const area = document.createElement('div');

        shuffledOptions.forEach((opt, index) => {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = `<span>${opt}</span>`;

            bubble.style.top = topPos + 'px';

            bubble.onclick = () => {
                if (isAnswered) return;
                isAnswered = true;
                clearInterval(animInterval); clearInterval(geniusTimerInterval);

                    bubble.style.background = 'var(--success)';

                    bubble.style.background = 'var(--danger)';
                    bubble.style.color = 'white';
                    wrongAnswers.push({ question: qData.q, correct: correctText, selected: opt });
                    showFeedback(false, () => { qIndex++; renderNextState(); });
                }
            };

            area.appendChild(bubble);
            bubbles.push({ el: bubble, top: topPos, speed: speed, isCorrect: opt === correctText, active: true });
        });

        container.appendChild(qBox);
        container.appendChild(area);
        
        let hint = document.createElement('div');
        hint.style.textAlign = 'center';
        hint.style.marginTop = '15px';
        hint.style.color = 'var(--primary)';
        hint.style.fontWeight = 'bold';

        hint.innerHTML = `💡 اضغط على الفقاعة التي تحمل الإجابة الصحيحة قبل أن تسقط!`;
        container.appendChild(hint);

        let areaHeight = 400;

        animInterval = setInterval(() => {
            if (isAnswered) return;
            bubbles.forEach(b => {
                if (!b.active) return;
                b.top += b.speed;
                b.el.style.top = b.top + 'px';
                
                b.el.style.transform = `translateX(${Math.sin(b.top / 20) * 5}px)`;

                if (b.top > areaHeight) {
                    b.active = false;
                    b.el.style.display = 'none';
                    if (b.isCorrect && !isAnswered) {
                        isAnswered = true;
                        clearInterval(animInterval); clearInterval(geniusTimerInterval);
                        wrongAnswers.push({ question: qData.q, correct: correctText, selected: "سقطت دون اختيار" });
                        showFeedback(false, () => { qIndex++; renderNextState(); });
                    }
                }
            });
        }, 30);
    }

    // 4. التنشين
    function renderShooting(container) {
        clearInterval(animInterval); clearInterval(geniusTimerInterval);
        const qData = currentQuestions[qIndex];
        const correctText = qData.options[qData.ans];
        const shuffledOptions = shuffleArray([...qData.options]);

        const qBox = document.createElement('div');
        qBox.className = 'question-box';
        qBox.innerText = qData.q;
        
        const area = document.createElement('div');
        area.className = 'shooting-area';

        let isAnswered = false;

        shuffledOptions.forEach((opt, index) => {
            const bird = document.createElement('div');
            bird.className = 'target-bird';
            
            bird.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg> <span>${opt}</span>`;
            
            let topPos = 15 + (index * 20); 
            bird.style.top = topPos + '%';
            
            let pos = (index % 2 === 0) ? -200 : window.innerWidth;
            let speed = (Math.random() * 2.5 + 1.5) * ((index % 2 === 0) ? 1 : -1);
            
            bird.style.left = pos + 'px';

            bird.onclick = () => {
                if(isAnswered) return;
                isAnswered = true;

                if (opt === correctText) {
                    bird.style.background = 'var(--success)';
                    bird.style.color = 'white';
                    bird.style.borderColor = 'white';
                    showFeedback(true, () => { qIndex++; renderNextState(); });
                } else {
                    bird.style.background = 'var(--danger)';
                    bird.style.color = 'white';
                    bird.style.borderColor = 'white';
                    wrongAnswers.push({ question: qData.q, correct: correctText, selected: opt });
                    showFeedback(false, () => { qIndex++; renderNextState(); });
                }
            };

            area.appendChild(bird);

            animInterval = setInterval(() => {
                if (isAnswered) return;
                pos += speed;
                if (pos > window.innerWidth + 50) pos = -250;
                if (pos < -250) pos = window.innerWidth + 50;
                bird.style.left = pos + 'px';
            }, 20);
        });

        container.appendChild(qBox);
        container.appendChild(area);
        
        let hint = document.createElement('div');
        hint.style.textAlign = 'center';
        hint.style.marginTop = '15px';
        hint.style.color = 'var(--primary)';
        hint.style.fontWeight = 'bold';
        hint.style.fontSize = '1.1rem';
        hint.style.display = 'flex';
        hint.style.alignItems = 'center';
        hint.style.justifyContent = 'center';
        hint.style.gap = '8px';
        hint.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg> اضغط على الإجابة الصحيحة وهي تتحرك لاصطيادها!`;
        container.appendChild(hint);
    }

    window.onload = initApp;
</script>

<script src="../../../results-config.js"></script>
<script>
/* ===== ختم النتيجة وكود التحقق — لا تعدّل هذا الجزء ===== */
(function () {
  var K = 'mfm·ar·2026·q7Zt4';
  var ALPHA = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  var EPOCH = Date.UTC(2025, 0, 1);

  function norm(s) {
    return String(s == null ? '' : s).normalize('NFC')
      .replace(/[​-‏‪-‮⁦-⁩﻿]/g, '')
      .replace(/\s+/g, ' ').trim();
  }
  function h53(str, seed) {
    var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (var i = 0, ch; i < str.length; i++) {
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);
  }
  function sig(name, lesson, game, s, t, m) {
    var str = [norm(name), norm(lesson), norm(game), s, t, m, K].join('|');
    return h53(str, 7919) % 1073741824; // 30 bits
  }
  var P40 = 1099511627776, P32 = 4294967296;
  function mask(h) { return h53('m' + h + K, 31) % P40; }
  function xor40(a, b) {
    var ah = Math.floor(a / P32), bh = Math.floor(b / P32);
    return ((ah ^ bh) & 255) * P32 + (((a % P32) ^ (b % P32)) >>> 0);
  }
  function b32(n, len) { var o = ''; for (var i = 0; i < len; i++) { o = ALPHA[n % 32] + o; n = Math.floor(n / 32); } return o; }
  function unb32(str) { var n = 0; for (var i = 0; i < str.length; i++) { var v = ALPHA.indexOf(str[i]); if (v < 0) return -1; n = n * 32 + v; } return n; }

  function encode(s, t, m, h) {
    var body = xor40(s * P32 + t * 16777216 + m, mask(h));
    var out = b32(body, 8) + b32(h, 6);
    return out.slice(0, 4) + '-' + out.slice(4, 8) + '-' + out.slice(8, 12) + '-' + out.slice(12);
  }
  function decode(code) {
    var c = String(code).toUpperCase().replace(/[^0-9A-Z]/g, '').replace(/O/g, '0').replace(/I/g, '1');
    if (c.length !== 14) return null;
    var body = unb32(c.slice(0, 8)), h = unb32(c.slice(8));
    if (body < 0 || h < 0 || h >= 1073741824 || body >= P40) return null;
    body = xor40(body, mask(h));
    var hi = Math.floor(body / P32), lo = body % P32;
    return { h: h, s: hi & 255, t: (lo >>> 24) & 255, m: lo & 0xFFFFFF };
  }
  function fmtTime(m) {
    var d = new Date(EPOCH + m * 60000);
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' – ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function g(v) { try { return v(); } catch (e) { return undefined; } }

  // يُستدعى من زر "إرسال النتيجة": يعيد كتابة الرسالة بصيغة موحّدة ومعها كود التحقق
  window.__sealResult = function (original) {
    original = String(original || '');
    var sm = original.match(/(?:النتيجة|نتيجتي)\s*:\s*(\d+)\s*من\s*(\d+)/);
    if (!sm) return original;
    var s = Math.min(255, +sm[1]), t = Math.min(255, +sm[2]);
    var inp = document.getElementById('student-name-input');
    var name = norm(inp ? inp.value : '');
    var lesson = norm(g(function () { return LESSON_FULL_NAME; }) || g(function () { return LESSON_TITLE; }) ||
      g(function () { return LESSON_NAME; }) || ((original.match(/الدرس\s*:\s*(.+)/) || [])[1]) || document.title);
    var game = norm(((original.match(/اللعبة\s*:\s*(.+)/) || [])[1]) || g(function () { return currentGame.title; }) || '');
    var m = Math.floor((Date.now() - EPOCH) / 60000) & 0xFFFFFF;
    var code = encode(s, t, m, sig(name, lesson, game, s, t, m));
    var first = original.split('\n')[0];
    var greet = /مرحب/.test(first) ? norm(first) : 'مرحبًا أستاذ محمد 🌟';
    return greet + '\n' +
      '👤 الطالب/ـة: ' + name + '\n' +
      '📘 الدرس: ' + lesson + '\n' +
      '🎮 اللعبة: ' + game + '\n' +
      '✅ النتيجة: ' + s + ' من ' + t + ' (' + Math.round(s * 100 / (t || 1)) + '%)\n' +
      '🕒 وقت الإرسال: ' + fmtTime(m) + '\n' +
      '🔐 كود التحقق: ' + code + '\n' +
      '⚠️ أي تعديل في هذه الرسالة يكشفه كود التحقق تلقائيًا.';
  };

  // التحقق: يقبل رسالة واحدة أو عدة رسائل ملصوقة معًا
  window.__verifyResults = function (text) {
    text = String(text || '').replace(/\r/g, '');
    var re = /كود التحقق\s*:\s*([0-9A-Za-z\-\s]{14,22})/g, out = [], last = 0, mm;
    while ((mm = re.exec(text))) {
      var block = text.slice(last, mm.index);
      last = mm.index + mm[0].length;
      var pick = function (r) { var x = block.match(r); return x ? norm(x[1]) : ''; };
      var name = pick(/الطالب\/ـة\s*:\s*([^\n]*)/), lesson = pick(/الدرس\s*:\s*([^\n]*)/), game = pick(/اللعبة\s*:\s*([^\n]*)/);
      var shown = block.match(/النتيجة\s*:\s*(\d+)\s*من\s*(\d+)/);
      var d = decode(mm[1].replace(/\s/g, '').slice(0, 17));
      var r = { name: name, lesson: lesson, game: game, shown: shown ? (shown[1] + ' من ' + shown[2]) : '—' };
      if (!d || sig(name, lesson, game, d.s, d.t, d.m) !== d.h || d.t === 0 || d.s > d.t) {
        r.status = 'bad';
      } else {
        r.real = d.s + ' من ' + d.t; r.time = fmtTime(d.m);
        r.status = (shown && +shown[1] === d.s && +shown[2] === d.t) ? 'ok' : 'edited';
      }
      out.push(r);
    }
    return out;
  };

  window.__renderVerify = function (resultsEl, text) {
    var list = window.__verifyResults(text);
    if (!list.length) {
      resultsEl.innerHTML = '<div class="vr vr-bad">❌ لم يتم العثور على كود تحقق في النص.<br>الرسالة إما من نسخة قديمة من اللعبة أو تم حذف الكود منها — لا يمكن الوثوق بها.</div>';
      return;
    }
    var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    resultsEl.innerHTML = list.map(function (r) {
      var head = r.status === 'ok' ? '✅ النتيجة سليمة ولم يتم تعديلها'
        : r.status === 'edited' ? '⚠️ تم تعديل الدرجة في الرسالة!'
        : '❌ الرسالة معدّلة (الاسم أو الدرس أو اللعبة أو الكود) — لا يمكن الوثوق بها';
      var body = '<b>الطالب:</b> ' + esc(r.name || '—') + '<br><b>الدرس:</b> ' + esc(r.lesson || '—') + '<br><b>اللعبة:</b> ' + esc(r.game || '—');
      if (r.status === 'ok') body += '<br><b>الدرجة:</b> ' + r.real + '<br><b>وقت الإرسال:</b> ' + r.time;
      if (r.status === 'edited') body += '<br><b>المكتوب في الرسالة:</b> <s>' + esc(r.shown) + '</s><br><b>الدرجة الحقيقية:</b> <span style="font-size:1.25em">' + r.real + '</span><br><b>وقت الإرسال:</b> ' + r.time;
      if (r.status === 'bad') body += '<br><b>المكتوب في الرسالة:</b> ' + esc(r.shown);
      return '<div class="vr vr-' + r.status + '"><div class="vr-h">' + head + '</div>' + body + '</div>';
    }).join('');
  };

  window.__VERIFY_CSS = '.vr{border-radius:12px;padding:12px 14px;margin:10px 0;line-height:1.9;text-align:right;font-size:1rem;color:#111827}' +
    '.vr-h{font-weight:800;margin-bottom:4px;font-size:1.05rem}.vr-ok{background:#dcfce7;border:2px solid #16a34a}' +
    '.vr-edited{background:#fef3c7;border:2px solid #d97706}.vr-bad{background:#fee2e2;border:2px solid #dc2626}';
})();

/* ===== شاشة التحقق للمعلم: افتح رابط الدرس وأضف في آخره ‎#verify ===== */
(function () {
  function open() {
    if (document.getElementById('__verify-overlay')) return;
    var st = document.createElement('style');
    st.textContent = window.__VERIFY_CSS +
      '#__verify-overlay{position:fixed;inset:0;z-index:999999;background:rgba(15,23,42,.92);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px;direction:rtl;font-family:inherit}' +
      '#__verify-box{background:#fff;border-radius:18px;max-width:640px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.4)}' +
      '#__verify-box h2{margin:0 0 6px;color:#15803d;font-size:1.4rem}#__verify-box p{margin:0 0 10px;color:#4b5563;line-height:1.7}' +
      '#__verify-box textarea{width:100%;min-height:170px;box-sizing:border-box;border:2px solid #d1d5db;border-radius:12px;padding:10px;font-size:1rem;font-family:inherit;direction:rtl}' +
      '#__verify-box .vb{display:inline-block;border:0;border-radius:10px;padding:12px 20px;font-size:1.05rem;font-weight:700;cursor:pointer;margin:10px 0 0 8px;font-family:inherit}';
    document.head.appendChild(st);
    var ov = document.createElement('div');
    ov.id = '__verify-overlay';
    ov.innerHTML = '<div id="__verify-box"><h2>🔐 التحقق من نتائج الطلاب</h2>' +
      '<p>انسخ رسالة الطالب من واتساب كما هي (أو عدة رسائل مرة واحدة) والصقها هنا، ثم اضغط «تحقق».</p>' +
      '<textarea id="__verify-in" placeholder="الصق رسالة الطالب هنا..."></textarea>' +
      '<button class="vb" id="__verify-go" style="background:#16a34a;color:#fff">تحقق</button>' +
      '<button class="vb" id="__verify-clear" style="background:#e5e7eb;color:#111827">مسح</button>' +
      '<button class="vb" id="__verify-close" style="background:#e5e7eb;color:#111827">إغلاق</button>' +
      '<div id="__verify-out"></div></div>';
    document.body.appendChild(ov);
    var inp = document.getElementById('__verify-in'), out = document.getElementById('__verify-out');
    document.getElementById('__verify-go').onclick = function () { window.__renderVerify(out, inp.value); };
    document.getElementById('__verify-clear').onclick = function () { inp.value = ''; out.innerHTML = ''; inp.focus(); };
    document.getElementById('__verify-close').onclick = function () {
      ov.remove(); if (location.hash === '#verify') history.replaceState(null, '', location.pathname + location.search);
    };
  }
  function check() { if (/verify/i.test(location.hash) || /[?&]verify\b/i.test(location.search)) open(); }
  window.__openVerify = open;
  window.addEventListener('hashchange', check);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', check); else check();
})();

/* ===== إرسال النتيجة مباشرة لجدول نتائج الأستاذ (Google Sheets) ===== */
(function () {
  var QKEY = '__pending_results_v1';
  function url() { return (window.RESULTS_URL || '').trim(); }
  function g(v) { try { return v(); } catch (e) { return undefined; } }
  function norm(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }
  function loadQ() { try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch (e) { return []; } }
  function saveQ(q) { try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch (e) {} }

  function post(item) {
    return fetch(url(), { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(item) });
  }
  function flush() {
    if (!url() || !navigator.onLine) return;
    var q = loadQ(); if (!q.length) return;
    var item = q[0];
    post(item).then(function () { var r = loadQ().filter(function (x) { return x.id !== item.id; }); saveQ(r); if (r.length) flush(); }).catch(function () {});
  }
  window.addEventListener('online', flush);
  window.addEventListener('load', function () { setTimeout(flush, 1500); });

  function toast(html, color) {
    var t = document.getElementById('__res-toast');
    if (!t) {
      t = document.createElement('div'); t.id = '__res-toast';
      t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:999999;max-width:92%;width:420px;' +
        'padding:16px 18px;border-radius:16px;color:#fff;font-weight:700;font-size:1.05rem;line-height:1.7;text-align:center;' +
        'box-shadow:0 12px 30px rgba(0,0,0,.35);direction:rtl;font-family:inherit;transition:opacity .3s';
      document.body.appendChild(t);
    }
    t.style.background = color; t.innerHTML = html; t.style.opacity = '1';
    clearTimeout(t._h); t._h = setTimeout(function () { t.style.opacity = '0'; }, 5000);
  }

  // يرجع true لو اتعامل مع الإرسال (فاللعبة متفتحش واتساب)، false لو مفيش رابط جدول
  window.__sendToSheet = function (original) {
    if (!url()) return false;
    original = String(original || '');
    var sm = original.match(/(?:النتيجة|نتيجتي)\s*:\s*(\d+)\s*من\s*(\d+)/);
    if (!sm) return false;
    var inp = document.getElementById('student-name-input');
    var name = norm(inp ? inp.value : '');
    var btn = document.querySelector('button[onclick*="sendResult"]');
    if (btn && btn.dataset.sent === '1') { toast('✅ نتيجتك اتبعتت للأستاذ قبل كده', '#16a34a'); return true; }
    var item = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      name: name,
      lesson: norm(g(function () { return LESSON_FULL_NAME; }) || g(function () { return LESSON_TITLE; }) || g(function () { return LESSON_NAME; }) || document.title),
      game: norm(((original.match(/اللعبة\s*:\s*(.+)/) || [])[1]) || g(function () { return currentGame.title; }) || ''),
      score: +sm[1], total: +sm[2],
      page: decodeURIComponent(location.pathname.split('/').slice(-3).join('/')),
      clientTime: new Date().toISOString()
    };
    if (btn) { btn.dataset.sent = '1'; btn.disabled = true; btn.style.opacity = '.6'; btn.innerHTML = '✅ تم إرسال النتيجة للأستاذ'; }
    if (inp) inp.disabled = true;
    var q = loadQ(); q.push(item); saveQ(q);
    if (!navigator.onLine) {
      toast('📴 مفيش إنترنت دلوقتي<br>نتيجتك اتحفظت وهتتبعت للأستاذ تلقائيًا أول ما النت يرجع', '#d97706');
      return true;
    }
    toast('⏳ جاري إرسال النتيجة...', '#2563eb');
    post(item).then(function () {
      saveQ(loadQ().filter(function (x) { return x.id !== item.id; }));
      toast('✅ تم إرسال نتيجتك للأستاذ بنجاح<br>' + item.score + ' من ' + item.total, '#16a34a');
    }).catch(function () {
      toast('📴 النت ضعيف — نتيجتك اتحفظت وهتتبعت تلقائيًا لما النت يرجع', '#d97706');
    });
    return true;
  };
})();
