    <style>
        :root {
            /* ألوان الأستاذ محمد فرج منصور (درجات الأخضر) */
            --primary: #14532d;      
            --primary-light: #16a34a; 
            --secondary: #059669;    
            --success: #10b981;      
            --danger: #ef4444;       
            --warning: #65a30d;      
            --dark: #1e293b;         
            --light: #f8fafc;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #eef6f0;
            background-image: radial-gradient(#c9dccd 1.5px, transparent 1.5px);
            background-size: 25px 25px;
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- الهيدر الرئيسي --- */
        .header-main {
            background: linear-gradient(135deg, #052e16, var(--primary), var(--secondary));
            color: white;
            padding: 30px 20px 90px 20px; 
            text-align: center;
            position: relative;
            margin-bottom: 20px;
        }

        .header-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-line1 {
            font-size: clamp(1.1rem, 4vw, 1.5rem); 
            font-weight: 700;
            color: #dcfce7;
            margin-bottom: 5px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.3);
        }

        .title-line2 {
            font-size: clamp(2.5rem, 8vw, 4rem); 
            font-weight: 900;
            background: linear-gradient(to right, #4ade80, #15803d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5));
            line-height: 1.1;
        }

        .header-main h2 { font-size: clamp(1.1rem, 3vw, 1.4rem); font-weight: 600; color: #ecfdf5; margin-bottom: 8px; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);}
        
        .header-wave {
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: auto;
            z-index: 1;
        }

        /* --- تصميم الحاويات والأقسام --- */
        .main-container {
            flex: 1;
            padding: 20px;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 40px;
            padding-bottom: 100px;
        }

        .grade-section {
            background: transparent;
        }

        .grade-title {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 3px solid var(--warning);
            padding-bottom: 10px;
        }

        .grade-title svg {
            width: 35px;
            height: 35px;
            stroke: var(--warning);
        }

        .unit-block {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 20px;
            border: 2px dashed #c9dccd;
            margin-bottom: 20px;
        }

        .unit-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--secondary);
            margin-bottom: 20px;
            background: white;
            display: inline-block;
            padding: 5px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* --- تصميم كروت الروابط --- */
        .link-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-right: 6px solid var(--primary-light);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            border-right-color: var(--warning);
        }

        .link-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-width: 250px;
        }

        .link-name {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .link-url {
            font-size: 0.95rem;
            color: #64748b;
            font-family: monospace;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 6px;
            display: inline-block;
            word-break: break-all;
            direction: ltr;
            text-align: left;
        }

        /* --- الأزرار --- */
        .actions-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-bottom: 3px solid rgba(0,0,0,0.2);
            text-decoration: none;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .btn:active { transform: translateY(2px); border-bottom: 0px; margin-top: 3px; }

        .btn-open {
            background: linear-gradient(to bottom, var(--primary-light), var(--primary));
            color: white;
        }

        .btn-copy {
            background: linear-gradient(to bottom, #10b981, #059669);
            color: white;
        }

        /* --- رسالة الإشعار (Toast) للنسخ --- */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: var(--dark);
            color: #fff;
            text-align: center;
            border-radius: 30px;
            padding: 16px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%) translateY(20px);
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s, visibility 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* الفوتر (Footer) */
        .footer-main {
            background: var(--dark); color: #cbd5e1;
            text-align: center; padding: 25px 20px; margin-top: auto;
            border-top: 4px solid var(--primary);
        }
        .footer-main p { margin: 5px 0; font-size: 1.1rem; font-weight: 600;}
        .footer-main .designer { font-size: 1rem; color: #94a3b8; font-weight: 400;}

        /* WhatsApp */
        .whatsapp-float {
            position: fixed; bottom: 25px; left: 25px;
            background: #25d366; color: white;
            width: 60px; height: 60px; border-radius: 50%;

        }

        .whatsapp-float svg { width: 32px; height: 32px; fill: currentColor; }

    </style>
</head>

    // دالة لتوليد واجهة المستخدم
    function renderLinks() {
        const container = document.getElementById('links-container');
        container.innerHTML = '';
        
        linksData.forEach(gradeData => {
            const gradeSection = document.createElement('div');
            gradeSection.className = 'grade-section';
            
            const gradeTitle = document.createElement('h2');
            gradeTitle.className = 'grade-title';
            gradeTitle.innerHTML = `

                ${gradeData.grade}
            `;
            gradeSection.appendChild(gradeTitle);

            gradeData.units.forEach(unit => {
                const unitBlock = document.createElement('div');
                unitBlock.className = 'unit-block';
                
                const unitTitle = document.createElement('h3');
                unitTitle.className = 'unit-title';
                unitTitle.innerText = unit.title;
                unitBlock.appendChild(unitTitle);

                unit.lessons.forEach(lesson => {
                    const card = document.createElement('div');
                    card.className = 'link-card';
                    
                    const openIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>`;
                    const copyIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;

                    card.innerHTML = `
                        <div class="link-info">
                            <div class="link-name" id="name-${lesson.id}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>

                            </div>
                            <span class="link-url">${lesson.url}</span>
                        </div>
                        <div class="actions-group">

                                ${openIcon} فتح الرابط
                            </a>
                            <button onclick="copyToClipboard('${lesson.url}')" class="btn btn-copy">
                                ${copyIcon} نسخ الرابط
                            </button>
                        </div>
                    `;
                    unitBlock.appendChild(card);
                    
                    // استدعاء دالة جلب الاسم لهذا الرابط تلقائياً
                    fetchLessonTitle(lesson.url, `name-${lesson.id}`);
                });

                gradeSection.appendChild(unitBlock);
            });

            container.appendChild(gradeSection);
        });

    // دالة لجلب عنوان الدرس (Title) من داخل الرابط برمجياً
    async function fetchLessonTitle(url, elementId) {
        try {
            // محاولة الجلب المباشر 
            let response = await fetch(url);
            let text = await response.text();
            extractAndSetTitle(text, elementId);
        } catch (e) {
            try {
                // في حالة حجب الطلب (CORS)، نستخدم وسيط AllOrigins
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                let response = await fetch(proxyUrl);
                let data = await response.json();
                extractAndSetTitle(data.contents, elementId);
            } catch (err) {
                // فشل جلب الاسم تماماً
                document.getElementById(elementId).innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    الدرس متاح (تعذر جلب الاسم)
                `;
            }
        }
    }

    // دالة استخراج النص من وسم Title
    function extractAndSetTitle(htmlString, elementId) {
        if (!htmlString) return;
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlString, 'text/html');
        let titleNode = doc.querySelector('title');
        let title = titleNode ? titleNode.innerText : 'درس بدون عنوان';
        
        // تنظيف العنوان لإزالة الكلمات الزائدة للحفاظ على التنسيق
        // يمكن تعديل هذه الكلمات حسب العناوين الفعلية في ملفات الأستاذ محمد فرج
        title = title.replace('درس', '').replace('لعبة مع الأستاذ محمد فرج منصور', '').trim();
        // إزالة أي شُرَط أو علامات زائدة في البداية
        if(title.startsWith('-') || title.startsWith('|')) {
             title = title.substring(1).trim();
        }
        if(title === '') title = 'الدرس';

        const nameElement = document.getElementById(elementId);
        if(nameElement) {
            nameElement.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 16 16 12 12 8"></polyline><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                ${title}
            `;
        }
    }

    // دالة نسخ الرابط بأمان مع إظهار إشعار (Toast)
    function copyToClipboard(text) {
        const tempInput = document.createElement("input");
        tempInput.value = text;
        document.body.appendChild(tempInput);
        tempInput.select();
        
        try {
            document.execCommand("copy");
            showToast(); 
        } catch (err) {
            console.error('فشل النسخ', err);
        }
        
        document.body.removeChild(tempInput);
    }

    let toastTimeout;
    function showToast() {
        const toast = document.getElementById("toast");
        toast.className = "show";
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(function(){ 
            toast.className = toast.className.replace("show", ""); 
        }, 3000);
    }

    // تشغيل دالة التوليد عند تحميل الصفحة
    window.onload = renderLinks;

</script>
</body>
